name: Test and build

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "bug/**"
      - "chore/**"
      - "hotfix/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPRIVATE: github.com/aukilabs/*
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare image tags
        if: startsWith(github.ref, 'refs/tags/')
        id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || ${#VERSION} -gt 128 ]]; then
            echo "::error::Image publishing requires vMAJOR.MINOR.PATCH with an optional RC/date suffix (128 characters maximum)."
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.3
      - name: Validate Helm chart
        run: make chart-check
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.23"
          # Keep private module source out of this public repository's cache.
          cache: false
      - name: Generate private module token
        id: module-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GLOBAL_PUBLIC_GITHUB_APP_ID }}
          private-key: ${{ secrets.GLOBAL_PUBLIC_GITHUB_APP_PRIVATE_KEY }}
          owner: aukilabs
          repositories: service-lib
          permission-contents: read
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ steps.module-token.outputs.token }}
        run: |
          gh auth setup-git
          go mod download
          go mod verify
      - name: Test
        run: make test
      - name: Check formatting and module files
        run: git diff --exit-code -- cmd pkg go.mod go.sum
      - name: Build
        run: make build
      - name: Vendor image dependencies
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ steps.module-token.outputs.token }}
        run: |
          go mod vendor
          git diff --exit-code -- go.mod go.sum
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # Keep records of the build containing private modules out of public artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          tags: |
            aukilabs/hagall:${{ steps.image.outputs.version }}
            aukilabs/hagall:${{ steps.image.outputs.revision }}
            aukilabs/hagall:latest
          labels: |
            org.opencontainers.image.source=https://github.com/aukilabs/hagall
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

  # Deployment is intentionally omitted until the new relay deployment is ready.
