name: Test and build

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "bug/**"
      - "chore/**"
      - "hotfix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/aukilabs/*
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          # Keep private module source out of this public repository's cache.
          cache: false
      - name: Generate private module token
        id: module-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GLOBAL_PUBLIC_GITHUB_APP_ID }}
          private-key: ${{ secrets.GLOBAL_PUBLIC_GITHUB_APP_PRIVATE_KEY }}
          owner: aukilabs
          repositories: service-lib
          permission-contents: read
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ steps.module-token.outputs.token }}
        run: |
          gh auth setup-git
          go mod download
          go mod verify
      - name: Test
        run: make test
      - name: Check formatting and module files
        run: git diff --exit-code -- cmd pkg go.mod go.sum
      - name: Build
        run: make build
