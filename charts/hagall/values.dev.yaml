hagall:
  # Keep the prototype's resource names and selector when Argo adopts it.
  fullnameOverride: auki-relay-node

  relay:
    capacity: 2048
    maxCircuitsPerPeer: 128
    acceptBookings: true
    authConcurrency: 128
    # Requires the independent source-auth budget fix; keep concurrency at 128.
    authAttemptsPerIP: 512
    authAttemptsPerPeer: 128

  podMonitor:
    enabled: true
