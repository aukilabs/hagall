apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hagall.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hagall.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hagall.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hagall.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add .Values.relay.shutdownDrainSeconds 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-identity
          image: {{ include "hagall.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /identity-source/registration-credentials /identity/registration-credentials
              cp /identity-source/wallet-private-key /identity/wallet-private-key
              cp /identity-source/libp2p-private-key /identity/libp2p-private-key
              chmod 0600 /identity/registration-credentials
              chmod 0600 /identity/wallet-private-key
              chmod 0600 /identity/libp2p-private-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: identity-source
              mountPath: /identity-source
              readOnly: true
            - name: identity
              mountPath: /identity
      containers:
        - name: relay
          image: {{ include "hagall.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RELAY_DDS_URL
              value: {{ .Values.relay.ddsUrl | quote }}
            - name: RELAY_DDS_PUBLIC_KEY_URL
              value: {{ .Values.relay.ddsPublicKeyUrl | quote }}
            - name: RELAY_DMS_URL
              value: {{ .Values.relay.dmsUrl | quote }}
            - name: RELAY_REGISTRATION_CREDENTIALS_FILE
              value: /identity/registration-credentials
            - name: RELAY_WALLET_PRIVATE_KEY_FILE
              value: /identity/wallet-private-key
            - name: RELAY_LIBP2P_PRIVATE_KEY_FILE
              value: /identity/libp2p-private-key
            - name: RELAY_TCP_LISTEN_MULTIADDR
              value: /ip4/0.0.0.0/tcp/4001
            - name: RELAY_WS_LISTEN_MULTIADDR
              value: /ip4/0.0.0.0/tcp/4002/ws
            - name: RELAY_PUBLIC_BASE_MULTIADDRS
              value: {{ printf "/dns4/%s/tcp/%v/p2p/%s,/dns4/%s/tcp/%v/wss/p2p/%s" .Values.relay.publicHost .Values.service.public.tcpPort .Values.relay.peerId .Values.relay.publicHost .Values.service.public.websocketPort .Values.relay.peerId | quote }}
            - name: RELAY_ADMIN_ADDR
              value: 0.0.0.0:9090
            - name: RELAY_METRICS_ADDR
              value: 0.0.0.0:9091
            - name: RELAY_ADMISSION_TTL
              value: {{ .Values.relay.admissionTTL | quote }}
            - name: RELAY_AUTH_MAX_CONCURRENCY
              value: {{ .Values.relay.authConcurrency | quote }}
            - name: RELAY_AUTH_MAX_ATTEMPTS_PER_IP
              value: {{ .Values.relay.authAttemptsPerIP | quote }}
            - name: RELAY_AUTH_MAX_ATTEMPTS_PER_PEER
              value: {{ .Values.relay.authAttemptsPerPeer | quote }}
            {{- range $name := list "RELAY_DDS_MAX_CONCURRENCY" "RELAY_LOCAL_CAPACITY" "RELAY_MAX_RESERVATIONS" "RELAY_MAX_RESERVATIONS_PER_IP" "RELAY_MAX_RESERVATIONS_PER_ASN" "RELAY_MAX_CIRCUITS_PER_PEER" }}
            - name: {{ $name }}
              value: {{ $.Values.relay.capacity | quote }}
            {{- end }}
            - name: RELAY_ACCEPT_BOOKINGS
              value: {{ .Values.relay.acceptBookings | quote }}
            - name: RELAY_SHUTDOWN_DRAIN
              value: {{ printf "%vs" .Values.relay.shutdownDrainSeconds | quote }}
          ports:
            - name: relay
              containerPort: 4001
              protocol: TCP
            - name: relay-wss
              containerPort: 4002
              protocol: TCP
            - name: admin
              containerPort: 9090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: identity
              mountPath: /identity
              readOnly: true
      volumes:
        - name: identity-source
          secret:
            secretName: {{ .Values.identity.existingSecret | quote }}
            defaultMode: 0440
        - name: identity
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
