# Staging promotion: infrastructure supplies the retained staging identity,
# endpoints and AWS inputs. Never layer ci/values.yaml into a deployment.
hagall:
  # Separate Application/release from legacy hagall; never adopt its resources.
  fullnameOverride: auki-relay-node
  replicaCount: 1
  image:
    repository: aukilabs/hagall
    tag: v1.0.0-RC-6
    digest: sha256:76f356e15b645a2eeda8f3b681a54b9ec24d9423ef6fd02a1e98e8f533134bd5
  relay:
    capacity: 128
    maxCircuitsPerPeer: 128
    # Sync only after DDS/DMS admission and billing verification.
    acceptBookings: true
    authConcurrency: 128
    authAttemptsPerIP: 512
    authAttemptsPerPeer: 128
  service:
    public:
      tcpPort: 443
      websocketPort: 4443
  # Sync the monitoring CRDs before the relay. Metrics remain private.
  podMonitor:
    enabled: true
